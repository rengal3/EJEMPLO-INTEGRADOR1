server.port=8080
spring.datasource.url=jdbc:derby:memory:colegiodb;create=true
spring.datasource.driver-class-name=org.apache.derby.jdbc.EmbeddedDriver
spring.jpa.database-platform=org.hibernate.dialect.DerbyDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Configuracion de Logback para la aplicacion
logging.level.root=INFO
logging.level.com.ejemplo.vaadin=DEBUG
logging.file.name=logs/app.log
